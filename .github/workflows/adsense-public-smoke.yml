name: Verify live AdSense ownership only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsense-public-smoke.yml'
      - 'index.html'
      - 'ads.txt'
      - 'guias.html'
      - 'guia-*.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adsense-public-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Assert real public HTTPS serves the publisher verification (no ads)
        shell: bash
        env:
          DOMAIN: jadeltechrd.com
          PUBLISHER: ca-pub-4830696678723029
        run: |
          set -euo pipefail
          home=$(mktemp)
          txt=$(mktemp)
          guide=$(mktemp)
          trap 'rm -f "$home" "$txt" "$guide"' EXIT

          fetch() {
            local pathname="$1" destination="$2" code
            code=$(curl --fail --silent --show-error --location \
              --connect-timeout 8 --max-time 20 \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              -H 'Cache-Control: no-cache' \
              --output "$destination" --write-out '%{http_code}' \
              "https://${DOMAIN}${pathname}") || return 1
            test "$code" = '200'
            test -s "$destination"
          }

          ready=false
          for attempt in 1 2 3 4 5 6; do
            echo "PUBLIC_ADSENSE_SMOKE_ATTEMPT=$attempt"
            if fetch '/' "$home" && \
               grep -Fq "<meta name=\"google-adsense-account\" content=\"${PUBLISHER}\">" "$home" && \
               fetch '/ads.txt' "$txt" && \
               grep -Fxq 'google.com, pub-4830696678723029, DIRECT, f08c47fec0942fa0' "$txt" && \
               test "$(wc -l < "$txt")" -eq 1 && \
               fetch '/guias.html' "$guide" && \
               grep -Fq 'Guías prácticas de inteligencia artificial y automatización' "$guide"; then
              ready=true
              break
            fi
            if [ "$attempt" -lt 6 ]; then sleep 8; fi
          done

          if [ "$ready" != true ]; then
            echo 'PUBLIC_ADSENSE_OWNERSHIP=FAIL'
            echo 'PUBLIC_DIAGNOSTICS_BEGIN'
            for spec in '/:home' '/ads.txt:ads' '/guias.html:guides'; do
              route="${spec%%:*}"
              name="${spec#*:}"
              body=$(mktemp)
              code=$(curl --silent --show-error --location --connect-timeout 8 --max-time 20 \
                --proto '=https' --proto-redir '=https' --tlsv1.2 \
                -H 'Cache-Control: no-cache' --output "$body" --write-out '%{http_code}' \
                "https://${DOMAIN}${route}" || true)
              echo "PUBLIC_DIAG_${name}_HTTP=${code:-curl_error}"
              echo "PUBLIC_DIAG_${name}_BYTES=$(wc -c < "$body")"
              if [ "$name" = 'home' ]; then
                if grep -Fq "<meta name=\"google-adsense-account\" content=\"${PUBLISHER}\">" "$body"; then
                  echo 'PUBLIC_DIAG_HOME_META=YES'
                else
                  echo 'PUBLIC_DIAG_HOME_META=NO'
                fi
                if grep -Fq 'Blueprint de automatización de leads desde US$250' "$body"; then
                  echo 'PUBLIC_DIAG_HOME_FINGERPRINT=CANONICAL_BLUEPRINT'
                elif grep -Fq 'Agentes de IA &amp; Automatización' "$body" || grep -Fq 'Agentes de IA & Automatización' "$body"; then
                  echo 'PUBLIC_DIAG_HOME_FINGERPRINT=ROOT_LEGACY'
                else
                  echo 'PUBLIC_DIAG_HOME_FINGERPRINT=UNKNOWN'
                fi
              elif [ "$name" = 'ads' ]; then
                grep -Fxq 'google.com, pub-4830696678723029, DIRECT, f08c47fec0942fa0' "$body" && echo 'PUBLIC_DIAG_ADS_TXT_MATCH=YES' || echo 'PUBLIC_DIAG_ADS_TXT_MATCH=NO'
                grep -Fq '<html' "$body" && echo 'PUBLIC_DIAG_ADS_TXT_HTML_RESPONSE=YES' || echo 'PUBLIC_DIAG_ADS_TXT_HTML_RESPONSE=NO'
              else
                grep -Fq 'Guías prácticas de inteligencia artificial y automatización' "$body" && echo 'PUBLIC_DIAG_GUIDE_PRESENT=YES' || echo 'PUBLIC_DIAG_GUIDE_PRESENT=NO'
              fi
              rm -f "$body"
            done
            echo 'PUBLIC_DIAGNOSTICS_END'
            exit 3
          fi
          ! grep -Fq 'adsbygoogle.js' "$home"
          ! grep -Fq 'pagead2.googlesyndication.com' "$home"
          echo "PUBLIC_ADSENSE_META=PASS"
          echo "PUBLIC_ADS_TXT=PASS"
          echo "PUBLIC_EDITORIAL_GUIDES=PASS"
          echo "PUBLIC_AD_SCRIPT_NOT_LOADED=PASS"
          echo "PUBLIC_SOURCE_SHA=${GITHUB_SHA}"
