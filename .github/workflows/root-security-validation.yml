name: Root Pages security validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'ga4-config.js'
      - 'ga4-loader.js'
      - 'analytics-consent.js'
      - 'analytics-consent.css'
      - 'revenue-funnel.js'
      - '.github/workflows/root-security-validation.yml'
      - '.github/workflows/sync-public-site.yml'
      - '.github/workflows/auto-merge-canonical-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root-public-site-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate public-site security contract
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app.js
          test -s styles.css
          grep -Fq 'Content-Security-Policy' index.html
          grep -Fq "default-src 'none'" index.html
          grep -Fq "script-src 'self'" index.html
          grep -Fq 'https://*.googletagmanager.com' index.html
          grep -Fq 'https://*.google-analytics.com' index.html
          grep -Fq "object-src 'none'" index.html
          grep -Fq 'strict-origin-when-cross-origin' index.html
          if grep -Eqi '<[^>]+on(load|error|click|mouseover|focus|submit)[[:space:]]*=' index.html; then
            echo 'INLINE_EVENT_HANDLER=FAIL'
            exit 20
          fi
          if grep -En '\beval[[:space:]]*\(|new[[:space:]]+Function[[:space:]]*\(|document\.write[[:space:]]*\(' app.js; then
            echo 'DANGEROUS_JS_PRIMITIVE=FAIL'
            exit 21
          fi
          if grep -EnE "(src|href)=[\"']http://" index.html; then
            echo 'INSECURE_HTTP_RESOURCE=FAIL'
            exit 22
          fi
          test -s ga4-config.js
          test -s ga4-loader.js
          test -s analytics-consent.js
          test -s analytics-consent.css
          test -s revenue-funnel.js
          grep -Fq 'G-K60SQ2ZHL9' ga4-config.js
          node --check app.js
          node --check ga4-config.js
          node --check ga4-loader.js
          node --check analytics-consent.js
          node --check revenue-funnel.js
          test "$(tr -d '\r\n' < CNAME)" = 'jadeltechrd.com'
          echo 'ROOT_PUBLIC_SITE_SECURITY=PASS'

      - name: Require immutable third-party Actions
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            if [[ ! "$ref" =~ @[0-9a-fA-F]{40}$ ]]; then
              echo "MUTABLE_ACTION_REFERENCE=FAIL ${ref}"
              bad=1
            fi
          done < <(grep -RhoE 'uses:[[:space:]]+[^[:space:]#]+' .github/workflows | awk '{print $2}')
          test "$bad" -eq 0
          grep -Fq 'actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1' .github/workflows/sync-public-site.yml
          grep -Fq 'actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1' .github/workflows/auto-merge-canonical-sync.yml
          echo 'ROOT_IMMUTABLE_ACTIONS=PASS'

      - name: Validate protected App auto-merge contract
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/workflows/auto-merge-canonical-sync.yml
          grep -Fq "github.event.workflow_run.conclusion == 'success'" .github/workflows/auto-merge-canonical-sync.yml
          grep -Fq "github.event.workflow_run.event == 'pull_request'" .github/workflows/auto-merge-canonical-sync.yml
          grep -Fq "github.event.workflow_run.head_branch == 'automation/canonical-site-sync'" .github/workflows/auto-merge-canonical-sync.yml
          grep -Fq 'github.event.workflow_run.head_repository.full_name == github.repository' .github/workflows/auto-merge-canonical-sync.yml
          grep -Fq 'permission-contents: write' .github/workflows/auto-merge-canonical-sync.yml
          grep -Fq 'permission-pull-requests: write' .github/workflows/auto-merge-canonical-sync.yml
          grep -Fq 'expected_author="${APP_SLUG}[bot]"' .github/workflows/auto-merge-canonical-sync.yml
          grep -Fq -- "-f merge_method='squash'" .github/workflows/auto-merge-canonical-sync.yml
          grep -Fq 'POST_MERGE_SIGNATURE=PASS' .github/workflows/auto-merge-canonical-sync.yml
          echo 'ROOT_APP_AUTOMERGE_CONTRACT=PASS'
