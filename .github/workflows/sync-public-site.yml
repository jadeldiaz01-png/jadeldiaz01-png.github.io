name: Sync canonical public site by PR

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-public-site.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: canonical-public-site-sync
  cancel-in-progress: false

env:
  SYNC_BRANCH: automation/canonical-site-sync
  ROOT_REPOSITORY: jadeldiaz01-png/jadeldiaz01-png.github.io
  CANONICAL_REPOSITORY: jadeldiaz01-png/jadeltechrd.com

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout root Pages repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Prepare isolated synchronization branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C "$SYNC_BRANCH" origin/main

      - name: Fetch canonical public-site files
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          git clone --depth=1 "https://github.com/${CANONICAL_REPOSITORY}.git" "$tmp/source"
          for file in index.html styles.css app.js robots.txt sitemap.xml; do
            test -s "$tmp/source/$file"
            cp "$tmp/source/$file" "$file"
          done
          test "$(tr -d '\r\n' < CNAME)" = 'jadeltechrd.com'
          echo 'Canonical site + SEO discovery files staged on isolated branch; CNAME preserved.'

      - name: Validate required public views, metadata and security baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Agentes de IA & Automatización | Jadel Tech RD' index.html
          grep -Fq 'static-commercial-fallback' index.html
          grep -Fq 'Agentes de IA que' index.html
          grep -Fq 'CineForge · Video Premium' index.html
          grep -Fq 'property="og:title"' index.html
          grep -Fq 'http-equiv="Content-Security-Policy"' index.html
          grep -Fq "default-src 'none'" index.html
          grep -Fq "script-src 'self'" index.html
          grep -Fq "object-src 'none'" index.html
          grep -Fq 'strict-origin-when-cross-origin' index.html
          grep -Fq 'data-deletion' app.js
          grep -Fq 'privacy' app.js
          grep -Fq 'terms' app.js
          grep -Fq 'Sitemap: https://jadeltechrd.com/sitemap.xml' robots.txt
          grep -Fq 'https://jadeltechrd.com/?view=data-deletion' sitemap.xml
          test -s styles.css
          node --check app.js
          echo 'PUBLIC_SITE_SECURITY_SOURCE_VALIDATION=PASS'

      - name: Detect synchronized changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html styles.css app.js robots.txt sitemap.xml; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'CANONICAL_SYNC_REQUIRED=NO'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'CANONICAL_SYNC_REQUIRED=YES'
          fi

      - name: Generate least-privilege GitHub App token
        id: app-token
        if: steps.changes.outputs.changed == 'true' && vars.ROOT_SYNC_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.ROOT_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.ROOT_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: jadeldiaz01-png.github.io
          permission-contents: write
          permission-pull-requests: write

      - name: Select least-privilege synchronization credential
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          ROOT_SYNC_PR_TOKEN: ${{ secrets.ROOT_SYNC_PR_TOKEN }}
          BUILTIN_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${APP_TOKEN:-}" ]; then
            printf 'SYNC_WRITE_TOKEN=%s\n' "$APP_TOKEN" >> "$GITHUB_ENV"
            printf 'GH_TOKEN=%s\n' "$APP_TOKEN" >> "$GITHUB_ENV"
            printf 'SYNC_APP_SLUG=%s\n' "$APP_SLUG" >> "$GITHUB_ENV"
            echo 'SYNC_TOKEN_SOURCE=GITHUB_APP_INSTALLATION_TOKEN'
          elif [ -n "${ROOT_SYNC_PR_TOKEN:-}" ]; then
            echo "::add-mask::${ROOT_SYNC_PR_TOKEN}"
            printf 'SYNC_WRITE_TOKEN=%s\n' "$ROOT_SYNC_PR_TOKEN" >> "$GITHUB_ENV"
            printf 'GH_TOKEN=%s\n' "$ROOT_SYNC_PR_TOKEN" >> "$GITHUB_ENV"
            echo 'SYNC_TOKEN_SOURCE=ROOT_SYNC_PR_TOKEN_FALLBACK'
          else
            printf 'SYNC_WRITE_TOKEN=%s\n' "$BUILTIN_GITHUB_TOKEN" >> "$GITHUB_ENV"
            printf 'GH_TOKEN=%s\n' "$BUILTIN_GITHUB_TOKEN" >> "$GITHUB_ENV"
            echo 'SYNC_TOKEN_SOURCE=GITHUB_TOKEN_FALLBACK'
            echo 'SYNC_AUTONOMY_NOTE=Install the dedicated GitHub App for autonomous PR-triggered CI without broad user credentials.'
          fi

      - name: Configure synchronization actor
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SYNC_APP_SLUG:-}" ]; then
            bot_id=$(gh api "/users/${SYNC_APP_SLUG}[bot]" --jq '.id')
            git config user.name "${SYNC_APP_SLUG}[bot]"
            git config user.email "${bot_id}+${SYNC_APP_SLUG}[bot]@users.noreply.github.com"
            echo "SYNC_COMMIT_ACTOR=${SYNC_APP_SLUG}[bot]"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            echo 'SYNC_COMMIT_ACTOR=github-actions[bot]'
          fi

      - name: Commit and publish synchronization branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add index.html styles.css app.js robots.txt sitemap.xml
          git commit -m 'site: sync canonical public application'
          git remote set-url origin "https://x-access-token:${SYNC_WRITE_TOKEN}@github.com/${ROOT_REPOSITORY}.git"
          git push --force-with-lease origin "HEAD:${SYNC_BRANCH}"
          echo 'SYNC_BRANCH_PUBLISHED=PASS'

      - name: Create or update synchronization pull request
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh pr list --repo "$ROOT_REPOSITORY" --base main --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$ROOT_REPOSITORY" \
              --title 'site: synchronize canonical public application' \
              --body $'Automated synchronization from the canonical Jadel Tech RD repository.\n\nSecurity contract:\n- no direct push to main\n- root-public-site-validation must pass\n- dedicated GitHub App is preferred for least-privilege automation\n- CNAME is preserved\n'
            echo "SYNC_PR_UPDATED=${existing}"
          else
            if ! gh pr create --repo "$ROOT_REPOSITORY" --base main --head "$SYNC_BRANCH" \
              --title 'site: synchronize canonical public application' \
              --body $'Automated synchronization from the canonical Jadel Tech RD repository.\n\nSecurity contract:\n- no direct push to main\n- root-public-site-validation must pass\n- dedicated GitHub App is preferred for least-privilege automation\n- CNAME is preserved\n'; then
              echo 'SYNC_PR_CREATE=BLOCKED'
              echo 'The synchronization branch remains available. Configure ROOT_SYNC_APP_CLIENT_ID + ROOT_SYNC_APP_PRIVATE_KEY, or a temporary least-privilege fallback credential, before retrying.'
              exit 30
            fi
            echo 'SYNC_PR_CREATED=PASS'
          fi
